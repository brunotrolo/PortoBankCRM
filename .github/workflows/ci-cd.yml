name: Porto Bank CRM — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: sa-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.sa-east-1.amazonaws.com
  ENVIRONMENT: prod

jobs:
  # ------------------------------------------------------------
  # 1. Testes e lint do backend
  # ------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aws-crm-platform/packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ------------------------------------------------------------
  # 2. Build e push imagens para ECR
  # ------------------------------------------------------------
  build-images:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      api-image: ${{ steps.build-api.outputs.image }}
      worker-image: ${{ steps.build-worker.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push API image
        id: build-api
        run: |
          cd aws-crm-platform/packages/backend
          docker build -t ${{ env.ECR_REGISTRY }}/porto-bank-crm-api:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/porto-bank-crm-api:latest .
          docker push ${{ env.ECR_REGISTRY }}/porto-bank-crm-api:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/porto-bank-crm-api:latest
          echo "image=${{ env.ECR_REGISTRY }}/porto-bank-crm-api:${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Build and push Worker image
        id: build-worker
        run: |
          cd aws-crm-platform/packages/backend
          docker build -t ${{ env.ECR_REGISTRY }}/porto-bank-crm-worker:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/porto-bank-crm-worker:latest .
          docker push ${{ env.ECR_REGISTRY }}/porto-bank-crm-worker:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/porto-bank-crm-worker:latest
          echo "image=${{ env.ECR_REGISTRY }}/porto-bank-crm-worker:${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Build and push Frontend image
        id: build-frontend
        run: |
          cd aws-crm-platform/packages/frontend
          docker build -t ${{ env.ECR_REGISTRY }}/porto-bank-crm-frontend:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/porto-bank-crm-frontend:latest .
          docker push ${{ env.ECR_REGISTRY }}/porto-bank-crm-frontend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/porto-bank-crm-frontend:latest
          echo "image=${{ env.ECR_REGISTRY }}/porto-bank-crm-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------
  # 3. Terraform apply (infraestrutura)
  # ------------------------------------------------------------
  terraform-apply:
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_api_container_image: ${{ needs.build-images.outputs.api-image }}
      TF_VAR_worker_container_image: ${{ needs.build-images.outputs.worker-image }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}
      TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: ./aws-crm-platform/terraform
        run: terraform init
      - name: Terraform Validate
        working-directory: ./aws-crm-platform/terraform
        run: terraform validate
      - name: Terraform Plan
        working-directory: ./aws-crm-platform/terraform
        run: terraform plan -out=tfplan
      - name: Terraform Apply
        working-directory: ./aws-crm-platform/terraform
        run: terraform apply -auto-approve tfplan

  # ------------------------------------------------------------
  # 4. Atualizar serviço ECS com nova imagem
  # ------------------------------------------------------------
  ecs-deploy:
    needs: terraform-apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Force new deployment of ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
